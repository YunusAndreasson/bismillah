[workspace]
members = ["src-tauri", "crates/bismillah-lint"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[profile.dev]
# Tauri apps compile many crates; keep debug builds reasonably fast to run.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
