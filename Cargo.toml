[workspace]
members = ["src-tauri", "crates/bismillah-lint"]
resolver = "3"

[workspace.package]
# The one version of bismillah (package.json repeats it; src/core/version.test.ts checks).
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
# Tauri apps compile many crates; keep debug builds reasonably fast to run.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
