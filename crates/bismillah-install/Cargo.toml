[package]
name = "bismillah-install"
version.workspace = true
description = "Puts the bismillah stick's published image on a USB stick, or updates one, from macOS, Linux or Windows"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# The bytes of web/public/install.sh and install.ps1 (ADR-0017): those scripts download
# the image, check the disk and elevate; this program verifies the image, gives the
# stick its own GUIDs and stick-id, writes and reads back. It opens no network
# connection. Every dependency was already in the tree.
[dependencies]
# Inflates the published image's gzip parts on every OS (Windows has no gunzip).
flate2 = "1.1"
# Checks each downloaded part and the whole image against the manifest.
sha2 = "0.10"
# The GPT's CRC32.
crc32fast = "1.5"
# Random disk and partition GUIDs, from the OS, on every platform.
getrandom = "0.3"
