[package]
name = "bismillah-appliance"
version.workspace = true
description = "The bismillah stick's helper (os/PLAN.md): its home partition, unlock, keyboard, lock and power"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# The library is the protocol and the passphrase rules, shared with the app
# (src-tauri/src/appliance.rs). The binary is the helper that runs as root on the stick.
[lib]
name = "bismillah_appliance"

[[bin]]
name = "bismillah-helper"
path = "src/helper/main.rs"

# The debug image's file recorder for the allowlist (os/PLAN.md, OS-4); never in release.
[[bin]]
name = "bismillah-trace"
path = "src/trace/main.rs"
required-features = ["trace"]

# The debug image's socket probe: the uid check and the parser, against the running
# helper (os/PLAN.md, OS-5); never in release.
[[bin]]
name = "bismillah-probe"
path = "src/probe/main.rs"
required-features = ["trace"]

[features]
# The debug image's tools: the file recorder and the socket probe.
trace = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Clears passphrases from memory once they have been used.
zeroize = "1.9"
# Passphrase strength, so setup can refuse a guessable one (a hard problem).
zxcvbn = { version = "3.1", default-features = false }
# Already in the tree: the socket peer's uid (SO_PEERCRED) and the systemd socket.
libc = "0.2"

# Linux only, like the stick: macOS has no libdbus, and the app there needs only the library.
[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree (tao): logind's sleep signal and delay inhibitor, for the lock
# before sleep. D-Bus over the system bus's Unix socket; libdbus is in the image.
dbus = { version = "0.9", default-features = false }
