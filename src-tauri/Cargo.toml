[package]
name = "bismillah"
version = "0.0.0"
description = "A calm, offline Markdown editor"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bismillah_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Already in Tauri's dependency tree; used only to focus the native menu bar (platform.rs).
gtk = "0.18"
