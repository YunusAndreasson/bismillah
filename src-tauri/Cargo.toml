[package]
name = "bismillah"
version.workspace = true
description = "A calm, offline Markdown editor"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "bismillah_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8"
toml_edit = "0.25"
thiserror = "2"
notify = "8.2"
# Already in Tauri's tree (URL handling); NFD for the library's sort order, on a copy.
icu_normalizer = "2"
trash = "5.2"

# Spelling and grammar (ADR-0004); the workspace crate, free of Tauri.
bismillah-lint = { path = "../crates/bismillah-lint", version = "1.0.0" }
# The stick's helper protocol and passphrase rules (os/PLAN.md, OS-2); the workspace crate.
bismillah-appliance = { path = "../crates/bismillah-appliance", version = "1.0.0" }

# Print to Phone (ADR-0021); only debug builds use it until the phone app exists, so it
# isn't linked into a release or the stick.
bismillah-print = { path = "../crates/bismillah-print", version = "1.0.0" }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in Tauri's dependency tree; used only to focus the native menu bar (platform.rs).
gtk = "0.18"
# Already in the tree; renameat2(RENAME_NOREPLACE) for renames that never replace (platform.rs).
libc = "0.2"
# Already in Tauri's tree (wry pins it); turns off the webview's media, audio and WebGL (platform.rs).
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
