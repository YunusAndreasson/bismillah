[Service]
# The helper's step marks, through the journal to ttyS0; the VM tests may halt it at a
# step (/run/bismillah/test-halt) and then cut the power.
Environment=BISMILLAH_MARKS=1
StandardOutput=journal
StandardError=journal
# Above the console's threshold (journald.conf.d/debug.conf), so the marks reach it.
SyslogLevel=notice
