[Service]
# The app's boot marks (names and times only), through the journal to ttyS0.
Environment=BISMILLAH_MARKS=1
StandardOutput=journal
StandardError=journal
# Above the console's threshold (journald.conf.d/debug.conf), so the marks reach it.
SyslogLevel=notice
# A fake battery the VM tests fill (QEMU has none): see power_supplies() in
# src-tauri/src/appliance.rs. The release session reads /sys/class/power_supply.
Environment=BISMILLAH_POWER_SUPPLY=/run/bismillah-power
