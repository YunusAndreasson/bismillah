[Journal]
Storage=volatile
ForwardToConsole=yes
TTYPath=/dev/ttyS0
# The serial console is slow (115200 baud, and QEMU keeps to it) and whoever writes to
# it waits: at info level it held PID1 up by seconds and made every boot stage look
# slower than the release image's (os/PLAN.md, OS-4). Notice and above reach it; the
# helper's and the session's output are logged at notice (their drop-ins), so the
# marks and the helper's messages still do. The whole journal stays in RAM.
MaxLevelConsole=notice
