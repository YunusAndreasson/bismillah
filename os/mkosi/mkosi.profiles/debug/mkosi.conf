# The development image: the serial console, the journal on it, the app's and the
# helper's boot marks, and a root command line on the second serial port. Its home is
# set up and unlocked like the release image's. Never flashed for writing.

[Content]
# The allowlist's file recorder, built with the app (os/build/build-app.sh).
ExtraTrees=%D/../out/app-debug
Packages=
        procps
        kmod
        pciutils
# The serial console is slow and whoever writes to it waits (journald.conf.d/debug.conf):
# the kernel prints warnings and up, and systemd only failures.
KernelCommandLine=
        console=ttyS0,115200
        loglevel=4
        systemd.show_status=error
