# The development image: the serial console, the journal on it, the app's boot marks,
# a root command line on the second serial port, and a plain ext4 test home so saves
# survive a reboot before OS-2 encrypts it. Never flashed for writing.

[Output]
RepartDirectories=
RepartDirectories=%D/mkosi.profiles/debug/mkosi.repart

[Content]
Packages=
        procps
        kmod
        pciutils
        e2fsprogs
        cryptsetup-bin
KernelCommandLine=
        console=ttyS0,115200
        systemd.log_target=console
