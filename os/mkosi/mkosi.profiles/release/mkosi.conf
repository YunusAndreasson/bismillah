# The stick as it ships: nothing to log in with, no shell and no logging, not even to
# RAM. Its claims rest on tests that observe it only from outside (os/PLAN.md).

[Content]
KernelCommandLine=
        quiet
        loglevel=0
        systemd.show_status=false
        rd.udev.log_level=0
        udev.log_level=0
        systemd.log_target=null
        vt.global_cursor_default=0
        logo.nologo
RemoveFiles=
        # Opened only by debug diagnostics when the shared trace was recorded.
        # Release has neither a command line nor a running journal.
        /usr/bin/stty
        /usr/bin/journalctl
        /usr/bin/sh
        /usr/bin/bash
        /usr/bin/rbash
        /usr/bin/dash
        /usr/bin/perl*
        /usr/share/perl
        /usr/share/perl5
        /usr/lib/x86_64-linux-gnu/perl
        /usr/lib/x86_64-linux-gnu/perl-base
