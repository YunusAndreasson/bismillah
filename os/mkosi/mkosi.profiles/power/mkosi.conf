# The quiet-laptop check (os/PLAN.md, *A quiet laptop*): the debug image plus a report
# that measures the laptop idle in the editor, a phase at a time, with and without each
# power change, and writes it to the stick's ESP for Omarchy to read. Built with
# os/scripts/build.sh power (--profile=debug --profile=power). Never flashed for writing.

[Content]
# The measurements only: package energy (RAPL), CPU temperature and the fans, read and
# never set (dell-smm-hwmon on Dells; the firmware keeps controlling them).
KernelModules=
        /drivers/powercap/
        /drivers/hwmon/coretemp
        /drivers/hwmon/dell-smm-hwmon
