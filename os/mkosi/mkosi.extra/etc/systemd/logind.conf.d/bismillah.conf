[Login]
# No getty on any VT: an empty VT really is empty.
NAutoVTs=0
ReserveVT=0
# Closing the lid suspends, on battery and on mains alike. The helper locks the app
# before sleep (a delay inhibitor) and also on the lid itself, since logind ignores a
# lid closed within HoldoffTimeoutSec= of a resume (docs/spikes/os-suspend-lock.md).
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
# The helper decides within 1.5 s; this bound must stay well above it, or the system
# could sleep before the lock or the empty VT is up.
InhibitDelayMaxSec=5
