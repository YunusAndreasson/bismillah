d /home/writer 0700 writer writer -
# A quiet laptop: the CPU still speeds up for sustained work, but no longer jumps to
# full turbo for every keystroke's small burst, so it runs cooler and the fan stays
# down. Without a power daemon the firmware's preference (usually balance_performance)
# would stay. The preference lives in the CPU, not the firmware, and is gone at power
# off, so the laptop is untouched. Intel's and AMD's pstate drivers both take this
# value; where there is no such driver (the VMs) the glob matches nothing.
w /sys/devices/system/cpu/cpufreq/policy*/energy_performance_preference - - - - balance_power
