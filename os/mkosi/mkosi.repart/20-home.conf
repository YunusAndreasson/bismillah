[Partition]
# The writer's home, empty as flashed: OS-2 formats it (LUKS2, Argon2id) at first
# boot and grows it to the rest of the stick; reflashing never touches it. Found by
# its disk, never by label (docs/spikes/os-boot-device-binding.md).
Type=home
Label=bismillah-home
SizeMinBytes=512M
SizeMaxBytes=512M
GrowFileSystem=no
