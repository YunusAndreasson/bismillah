[Partition]
# The writer's home, empty as flashed: zeros, which the helper reads as Blank. Setup
# formats it (LUKS2, Argon2id) at first boot; flash.sh grows it to the rest of the
# stick, and reflashing never touches it. Found by its disk, never by label
# (docs/spikes/os-boot-device-binding.md). NoAuto keeps systemd's GPT generator from
# mounting, growing or unlocking it: the helper owns it.
Type=home
Label=bismillah-home
SizeMinBytes=512M
SizeMaxBytes=512M
NoAuto=yes
GrowFileSystem=no
