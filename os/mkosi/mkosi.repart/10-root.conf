[Partition]
Type=root
Format=erofs
CopyFiles=/
ExcludeFilesTarget=/boot/
ExcludeFilesTarget=/efi/
Verity=data
VerityMatchKey=root
Minimize=best
# Debian's 6.12 reads lz4, lzma, deflate and zstd erofs; zstd was the smallest and
# booted fastest on the cheap-stick profile (docs/spikes/os-size-boot.md).
Compression=zstd
# A fixed slot, so a reflash (os/scripts/stick.ts) can write a later, larger build into
# the same place without moving home: the root budget (450 MiB) and room above it.
# Minimize= still packs the file system; the rest of the slot is zeros.
SizeMinBytes=640M
SizeMaxBytes=640M
