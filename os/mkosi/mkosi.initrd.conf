# The initrd only finds the stick, opens the verity root and switches to it (os/PLAN.md,
# OS-4). mkosi's default initrd also carries what other systems boot with (Perl, btrfs,
# networkd, repart, an emergency shell): 107 MB unpacked, 32 MB on the ESP, read and
# unpacked by the firmware and the kernel on every boot. This keeps only what our boot
# runs. image-contents.ts checks that every remaining program's libraries are present,
# and the VM scenarios boot it.

[Content]
# Loads the USB stick's drivers at once (modules-load.d).
ExtraTrees=%D/mkosi.initrd.extra
# What the boot runs, and the libraries it needs (initrd-keep.txt, by prune.py).
FinalizeScripts=%D/initrd.finalize
RemoveFiles=
        # The hardware database (13.5 MB): finding a USB, NVMe or SATA disk doesn't
        # need it, and the keep-list keeps the rest of /usr/lib/udev.
        /usr/lib/udev/hwdb.bin
