# The initrd only finds the stick, opens the verity root and switches to it (os/PLAN.md,
# OS-4). mkosi's default initrd also carries what other systems boot with (Perl, btrfs,
# networkd, repart, an emergency shell): 107 MB unpacked, 32 MB on the ESP, read and
# unpacked by the firmware and the kernel on every boot. This removes what our boot
# never runs. image-contents.ts checks that every remaining program's libraries are
# present, and the VM scenarios boot it.

[Content]
RemoveFiles=
        # Nothing in the initrd runs Perl, a shell, a pager or debconf. The release image
        # has no shell either; a failed boot simply stops.
        /usr/bin/perl*
        /usr/lib/x86_64-linux-gnu/perl*
        /usr/share/perl*
        /usr/bin/bash
        /usr/bin/rbash
        /usr/bin/bashbug
        /usr/bin/less*
        /usr/bin/debconf*
        /usr/share/debconf
        /usr/bin/tic
        /usr/bin/infocmp
        # Character set conversion modules and the hardware database (13.5 MB): finding a
        # USB, NVMe or SATA disk needs neither.
        /usr/lib/x86_64-linux-gnu/gconv
        /usr/lib/udev/hwdb.bin
        /usr/bin/systemd-hwdb
        # File systems other than the erofs root: none is checked, made or mounted here.
        /usr/bin/btrfs*
        /usr/sbin/*btrfs*
        /usr/sbin/mkfs*
        /usr/sbin/mke2fs
        /usr/sbin/mkdosfs
        /usr/sbin/mkswap
        /usr/sbin/e2*
        /usr/sbin/e4*
        /usr/sbin/fsck.*
        /usr/sbin/dosfs*
        /usr/sbin/fatlabel
        /usr/sbin/debugfs
        /usr/sbin/dumpe2fs
        /usr/sbin/resize2fs
        /usr/sbin/tune2fs
        /usr/sbin/badblocks
        /usr/sbin/filefrag
        /usr/sbin/mklost+found
        /usr/lib/x86_64-linux-gnu/libext2fs.so*
        /usr/lib/x86_64-linux-gnu/libe2p.so*
        /usr/lib/x86_64-linux-gnu/libcom_err.so*
        /usr/lib/x86_64-linux-gnu/libss.so*
        /usr/lib/e2fsprogs
        # No network, no repartitioning, no TPM.
        /usr/lib/systemd/systemd-networkd*
        /usr/lib/systemd/systemd-network-generator
        /usr/lib/systemd/network
        /usr/lib/systemd/system/systemd-networkd*
        /usr/lib/systemd/system/systemd-network-generator*
        /usr/bin/networkctl
        /usr/bin/systemd-repart
        /usr/lib/systemd/repart
        /usr/lib/systemd/system/systemd-repart*
        /usr/lib/systemd/system/initrd-root-fs.target.wants/systemd-repart*
        /usr/lib/systemd/system/sysinit.target.wants/systemd-repart*
        /usr/lib/x86_64-linux-gnu/libtss2*
        /usr/lib/x86_64-linux-gnu/libfido2.so*
        /usr/bin/systemd-cryptenroll
        /usr/lib/systemd/systemd-pcr*
        /usr/lib/systemd/systemd-tpm2-setup
        /usr/lib/systemd/systemd-measure
        /usr/lib/systemd/systemd-storagetm
        /usr/lib/systemd/systemd-sbsign
        # Documentation, completions and package tooling.
        /usr/share/doc
        /usr/share/bash-completion
        /usr/share/zsh
        /usr/share/lintian
        /usr/share/common-licenses
        /usr/share/terminfo
        /usr/sbin/dpkg-*
        /usr/sbin/*user
        /usr/sbin/*group
        /usr/sbin/installkernel
        /usr/bin/kernel-install
