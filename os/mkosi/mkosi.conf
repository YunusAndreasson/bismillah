# The bismillah stick (os/PLAN.md, ADR-0013): Debian 13 that boots through Debian's
# Microsoft-signed shim → Debian-signed systemd-boot → Debian-signed kernel, with
# Secure Boot on and nothing enrolled, into cage and bismillah on an erofs root
# checked by dm-verity. Build it with os/scripts/build.sh (pnpm os:build), which
# picks the release or debug profile and refuses another mkosi version.

[Distribution]
Distribution=debian
Release=trixie
Repositories=main non-free-firmware
# Recorded in os/inputs.lock; change both together.
Snapshot=20261021T083704Z

[Output]
Format=disk
# zstd's slowest level for the initrds on the ESP: smaller to read, and as fast to unpack.
CompressLevel=19
ImageId=bismillah
OutputDirectory=%D/../out/image
# The stick's partitions: ESP, root, root verity, home (os/PLAN.md, *Partitions*).
RepartDirectories=%D/mkosi.repart

[Content]
Bootable=yes
Bootloader=systemd-boot-signed
ShimBootloader=signed
# Debian ships no signed UKI.
UnifiedKernelImages=none
Packages=
        # The boot chain
        linux-image-amd64
        shim-signed
        shim-helpers-amd64-signed
        systemd-boot-efi-amd64-signed
        systemd
        systemd-sysv
        udev
        dbus
        libpam-systemd
        dbus-user-session
        # The session: cage and the app's runtime (WebKitGTK from trixie-security)
        cage
        wlr-randr
        libwebkit2gtk-4.1-0
        libgtk-3-0t64
        libsoup-3.0-0
        # GPU acceleration (Mesa), and the WebKit sandbox
        libgl1-mesa-dri
        libegl1
        libgles2
        bubblewrap
        xdg-dbus-proxy
        # The helper's tools: LUKS2 for home, its ext4, and finding the stick's disk.
        cryptsetup-bin
        e2fsprogs
        # One small UI sans for system-ui; the editor's faces are in the binary.
        fonts-dejavu-core
        # GPU firmware for the declared families: Intel, AMD, NVIDIA (nouveau).
        firmware-intel-graphics
        firmware-amd-graphics
        firmware-nvidia-graphics
# The app and its helper, built by os/build/build-app.sh (pnpm os:app) from a committed ref.
ExtraTrees=%D/../out/app
# The default target, the units and the system's settings.
KernelCommandLine=
        noresume
        # usb-storage waits a whole second before it reads a new stick (its default,
        # for devices that misbehave when asked too soon); the boot waited on it
        # (os/PLAN.md, OS-4). UAS sticks don't wait at all.
        usb-storage.delay_use=100ms
        # No magic SysRq keys from the first moment: sysctl.d says the same, but only
        # once the system has started, and Debian's kernel allows most of them until then.
        sysctl.kernel.sysrq=0
        # The lockup detectors wake every CPU every few seconds to catch kernel hangs, a
        # developer's aid that only costs power on an appliance.
        nowatchdog
# The kernel modules, by hardware class (os/PLAN.md, OS-4): the storage the stick boots
# from, home's encryption and file system, keyboards and touchpads (USB, I2C, PS/2,
# the laptop's own keys), ACPI (battery, lid, power button, thermal, backlight), and the
# GPU families Intel, AMD, NVIDIA (nouveau) plus the VMs' virtio and VGA. mkosi adds
# what they depend on and the firmware they ask for. No sound: the stick has none.
# No network: no network, Wi-Fi, Bluetooth, NFC, CAN or USB-net modules, and none of
# the storage, crypto or filesystem modules that would pull them back in as
# dependencies (docs/spikes/os-no-network.md). Debian builds no physical network
# driver in, so a network card finds no driver. image-contents.test.ts checks it.
KernelModules=
        /arch/
        /block/
        /crypto/
        /lib/
        /mm/
        /drivers/usb/storage/
        /drivers/usb/host/
        /drivers/usb/core/
        /drivers/usb/common/
        /drivers/thunderbolt/
        /drivers/nvme/host/
        /drivers/ata/
        /drivers/scsi/sd_mod
        /drivers/scsi/sr_mod
        dm-mod
        dm-crypt
        dm-verity
        /fs/ext4/
        /fs/jbd2/
        /fs/mbcache
        /fs/erofs/
        /fs/efivarfs/
        /fs/fat/
        /fs/nls/
        /fs/autofs/
        /drivers/hid/
        /drivers/input/
        /drivers/i2c/
        /drivers/mfd/
        /drivers/pinctrl/
        /drivers/gpio/
        /drivers/dma/
        /drivers/platform/x86/
        /drivers/acpi/
        /drivers/power/
        /drivers/thermal/
        /drivers/cpufreq/
        /drivers/video/
        /drivers/leds/
        /drivers/gpu/drm/i915/
        /drivers/gpu/drm/xe/
        /drivers/gpu/drm/amd/
        /drivers/gpu/drm/radeon/
        /drivers/gpu/drm/nouveau/
        /drivers/gpu/drm/virtio/
        /drivers/gpu/drm/tiny/bochs
        /drivers/virtio/
        -/drivers/net/
        # A MIDI keyboard's driver would bring sound in.
        -/drivers/hid/hid-prodikeys
        -/drivers/bluetooth/
        -/drivers/nfc/
        -/drivers/infiniband/
        -/drivers/isdn/
        -/drivers/atm/
        -/drivers/staging/
        -/drivers/vhost/
        -/drivers/firewire/net
        -/drivers/usb/gadget/
        -/drivers/ssb/
        -/drivers/bcma/
        -/drivers/hv/
        -/drivers/scsi/cxgbi/
        -/drivers/scsi/bnx2fc/
        -/drivers/scsi/bnx2i/
        -/drivers/scsi/qedf/
        -/drivers/scsi/qedi/
        -/drivers/scsi/fcoe/
        -/drivers/crypto/chelsio/
        -/drivers/target/
        -/drivers/usb/atm/
        -/drivers/tty/ipwireless/
        -/drivers/block/rbd
        -/drivers/block/nbd
        -/drivers/block/drbd/
        -/drivers/nvme/target/
        -/drivers/nvme/host/nvme-tcp
        -/drivers/nvme/host/nvme-rdma
        -/drivers/nvme/host/nvme-fc
        -/fs/nfs/
        -/fs/nfs_common/
        -/fs/nfsd/
        -/fs/lockd/
        -/fs/smb/
        -/fs/afs/
        -/fs/ceph/
        -/fs/9p/
        -/fs/coda/
        -/fs/orangefs/
        -/fs/dlm/
        -/fs/ocfs2/
        -/fs/gfs2/
# The initrd only has to reach the verity root on a USB stick (or NVMe/SATA); the GPU
# drivers wait for the root, so the firmware reads a small initrd from the stick.
KernelInitrdModules=
        /drivers/usb/host/
        /drivers/usb/storage/
        /drivers/nvme/host/nvme
        /drivers/ata/ahci
        sd_mod
        dm-mod
        dm-verity
        erofs
        efivarfs
        # Crypto no module declares: libcrc32c (for erofs) asks the crypto API for
        # crc32c at load, and dm-verity picks its sha256 when it opens the root.
        crc32c_generic
        crc32c-intel
        sha256-ssse3
# The first stripping pass, by directory (OS-4 replaces it with a traced allowlist).
RemoveFiles=
        /usr/share/locale/*
        /usr/share/doc/*
        /usr/share/man/*
        /usr/share/info/*
        /usr/share/lintian
        /usr/share/bash-completion
        /usr/share/zsh
        # GRUB comes in with shim-signed's dependencies; the stick boots systemd-boot.
        /usr/lib/grub
        /usr/share/grub
        /usr/bin/grub-*
        /usr/sbin/grub-*
        # Debian's own copy of the kernel; the boot entry uses the one on the ESP.
        /boot/vmlinuz-*
        /boot/config-*
        /boot/System.map-*
        # The package manager and its database: the stick is reflashed, never updated.
        /usr/bin/apt*
        /usr/bin/dpkg*
        /usr/sbin/dpkg*
        /usr/lib/apt
        /usr/lib/dpkg
        /var/lib/apt
        /var/lib/dpkg
        /var/cache/apt
        /var/cache/debconf
        /etc/apt
        # Nothing to log in with, and no other way to become root.
        /usr/sbin/agetty
        /usr/bin/login
        /usr/sbin/sulogin
        /usr/bin/su
        /usr/sbin/nologin
CleanPackageMetadata=yes
# The allowlist: only what the system opened in the VM scenarios, the declared files
# and their libraries stay (prune.py, allowlist.txt, allowlist-declared.txt).
FinalizeScripts=%D/prune.py
# Not a first boot every time (machine-id.finalize).
FinalizeScripts=%D/machine-id.finalize
# Ctrl+Alt+Del powers off, and nothing the writer runs is setuid root (harden.finalize).
FinalizeScripts=%D/harden.finalize

[Build]
# erofs packs up to 64 KiB of the root per compressed cluster instead of 4 KiB: fewer
# reads from a stick that does few random reads a second (os/PLAN.md, OS-4).
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-C65536
# The tools mkosi builds with: a Debian tools tree from the same snapshot, built once
# by os/scripts/fetch.sh (which passes --tools-tree=yes) and kept in os/cache/, because
# mkosi would otherwise rebuild it online in every clean checkout.
ToolsTree=%D/../cache/mkosi.tools
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
ToolsTreeSnapshot=20261021T083704Z
# Filled by os/scripts/fetch.sh (pnpm os:fetch), the only stage that uses the network.
PackageCacheDirectory=%D/../cache/mkosi
# Repository metadata, which an offline build (CacheOnly=always) needs as well.
CacheDirectory=%D/../cache/mkosi-metadata
WorkspaceDirectory=%D/../out/work

[Runtime]
Firmware=uefi-secure-boot
FirmwareVariables=microsoft
RAM=2G
