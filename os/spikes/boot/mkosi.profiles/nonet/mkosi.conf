# OS-0 "No network": the image without network, Wi-Fi, Bluetooth, NFC, CAN or
# USB-net modules. The Debian kernel builds no physical network driver in (=y),
# so leaving the modules out leaves the hardware without a driver.
# (No firmware is installed at all yet; OS-1 adds GPU firmware only.)

[Content]
KernelModules=
        /arch/
        /block/
        /crypto/
        /drivers/
        /fs/
        /lib/
        /mm/
        /sound/
        /virt/
        -/drivers/net/
        -/drivers/bluetooth/
        -/drivers/nfc/
        -/drivers/infiniband/
        -/drivers/isdn/
        -/drivers/atm/
        -/drivers/staging/
        -/drivers/vhost/
        -/drivers/firewire/net
        -/drivers/usb/gadget/
        -/drivers/ssb/
        -/drivers/bcma/
        -/drivers/hv/
        # Pulled back in as dependencies otherwise (found in the first build):
        # storage and crypto offload over Chelsio, QLogic and Broadcom NICs, which
        # bring the NIC drivers themselves; USB ADSL modems; a 3G PC Card with PPP;
        # network filesystems and block devices.
        -/drivers/scsi/cxgbi/
        -/drivers/scsi/bnx2fc/
        -/drivers/scsi/bnx2i/
        -/drivers/scsi/qedf/
        -/drivers/scsi/qedi/
        -/drivers/scsi/fcoe/
        -/drivers/crypto/chelsio/
        -/drivers/target/
        -/drivers/usb/atm/
        -/drivers/tty/ipwireless/
        -/drivers/block/rbd
        -/drivers/block/nbd
        -/drivers/block/drbd/
        -/drivers/nvme/target/
        -/drivers/nvme/host/nvme-tcp
        -/drivers/nvme/host/nvme-rdma
        -/drivers/nvme/host/nvme-fc
        -/fs/nfs/
        -/fs/nfs_common/
        -/fs/nfsd/
        -/fs/lockd/
        -/fs/smb/
        -/fs/afs/
        -/fs/ceph/
        -/fs/9p/
        -/fs/coda/
        -/fs/orangefs/
        -/fs/dlm/
        -/fs/ocfs2/
        -/fs/gfs2/
