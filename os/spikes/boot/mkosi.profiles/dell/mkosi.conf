# OS-0 Dell check: everything OS-0 still needs from real hardware, in one image
# (--profile=app --profile=unlock --profile=nonet --profile=gpu --profile=slim
#  --profile=suspend --profile=dell). The Dell has no serial port, so the app's and
# the sleep daemon's marks go to the journal, and a report is written to the stick's
# ESP every 20 s (dell-report). See os/spikes/boot/DELL-CHECK.md.

[Output]
RepartDirectories=
RepartDirectories=%D/mkosi.profiles/dell/mkosi.repart

[Content]
Packages=
        pciutils
        usbutils
        util-linux
