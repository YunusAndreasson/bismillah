[Partition]
Type=esp
Format=vfat
# The ID the Dell's boot entry for the stick already points at (DELL-BOOT.md).
UUID=5ef75eba-e4b0-4e2a-b1a7-631a2999db75
CopyFiles=/boot:/
CopyFiles=/efi:/
# UEFI picks the FAT type by cluster count: a FAT32 under 65525 clusters reads as
# FAT16 and OVMF finds no files. 256 MiB with 4 KiB clusters falls under it.
SizeMinBytes=512M
SizeMaxBytes=512M
