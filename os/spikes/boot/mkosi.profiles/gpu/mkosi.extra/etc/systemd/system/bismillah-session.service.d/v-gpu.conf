# Named to sort after the unlock profile's drop-in and before the Dell profile's.
[Unit]
Wants=dev-dri-boot\x2dvga.device
After=dev-dri-boot\x2dvga.device

[Service]
# Only the boot display: on a hybrid the other GPU stays closed and can power down.
Environment=WLR_DRM_DEVICES=/dev/dri/boot-vga
# Not pinned: WEBKIT_WEB_RENDER_DEVICE_FILE lost the dark scheme with a missing node
# and left the window blank with a valid one under software rendering (GPU spike).
# Which Mesa driver cage and WebKit load, on the serial log (spike only).
Environment=LIBGL_DEBUG=verbose EGL_LOG_LEVEL=debug
StandardOutput=file:/dev/ttyS0
StandardError=file:/dev/ttyS0
