# OS-0 "GPU and display": use with the app profile. Adds the GPU firmware of the
# declared families (Intel, AMD, NVIDIA for nouveau) and makes cage wait for the
# display the firmware booted on, and use only that one.

[Distribution]
Repositories=non-free-firmware

[Content]
Packages=
        firmware-intel-graphics
        firmware-amd-graphics
        firmware-nvidia-graphics
