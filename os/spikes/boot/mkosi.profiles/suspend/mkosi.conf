# OS-0 "Suspend lock fallback": use with the app, unlock and probe profiles
# (--profile=app --profile=unlock --profile=probe --profile=suspend). Adds a spike
# sleep daemon that holds logind's delay inhibitor and falls back to an empty VT.

[Content]
ExtraTrees=%D/mkosi.profiles/suspend/app-tree
Packages=
        python3-gi
        gir1.2-glib-2.0
# No blinking cursor on the empty VT.
KernelCommandLine=vt.global_cursor_default=0
