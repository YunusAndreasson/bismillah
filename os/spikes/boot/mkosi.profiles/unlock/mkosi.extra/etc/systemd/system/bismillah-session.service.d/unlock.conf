# The app starts before home is unlocked, so nothing is copied into it here.
[Service]
ExecStartPre=
Environment=BISMILLAH_SPIKE_UNLOCK=/run/bismillah/helper.sock
# serial-getty@ttyS0 is masked: its hangup broke these handles.
StandardOutput=file:/dev/ttyS0
StandardError=file:/dev/ttyS0
# Font and shader caches in RAM: before unlock they would land in the empty home,
# and the mount would hide them (found by the helper's pre-mount listing).
Environment=XDG_CACHE_HOME=/run/user/1000/cache
# The keyboard spike: cage's layouts from the LUKS2 token, read before unlock.
ExecStartPre=+/usr/libexec/bismillah-keyboard-env
EnvironmentFile=-/run/bismillah/keyboard.env
