# OS-0 "Unlock in the app": use with the app profile (--profile=app --profile=unlock).
# Adds an empty home partition and a spike helper that sets it up and opens it,
# and starts the app before home exists.

[Output]
# Replaces the default mkosi.repart/ (copied here) to add the home partition.
RepartDirectories=%D/mkosi.profiles/unlock/mkosi.repart

[Content]
# The spike branch's build (os/build/build-app.sh <out> spike/os-unlock), over the app profile's.
ExtraTrees=%D/mkosi.profiles/unlock/app-tree
Packages=
        e2fsprogs
