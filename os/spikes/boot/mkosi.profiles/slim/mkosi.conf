# OS-0 "Size and boot baseline": the first stripping pass, by directory, over the
# product-like image (--profile=app --profile=unlock --profile=nonet --profile=gpu
# --profile=slim). The root is zstd-compressed erofs; add --profile=erofs-lz4hc or
# --profile=erofs-none after this one to compare. The home partition is the unlock
# profile's.

[Output]
RepartDirectories=
RepartDirectories=%D/mkosi.profiles/slim/mkosi.repart

[Content]
RemoveFiles=
        /usr/share/locale/*
        /usr/share/doc/*
        /usr/share/man/*
        /usr/share/info/*
        /usr/share/lintian
        /usr/share/bash-completion
        # GRUB comes in with shim-signed's dependencies; the stick boots systemd-boot.
        /usr/lib/grub
        /usr/share/grub
        /usr/bin/grub-*
        /usr/sbin/grub-*
        # Debian's own copy of the kernel; the boot entry uses the one mkosi installs.
        /boot/vmlinuz-*
        /boot/config-*
        /boot/System.map-*
# The initrd only has to reach the verity root on a USB stick. By default mkosi puts
# every module (and with them the GPU firmware) in it: 127 MB on the ESP, which the
# firmware reads from the stick before the kernel starts. The unlock is in the app,
# after switch-root, so no GPU driver is needed this early.
KernelInitrdModules=
KernelInitrdModules=
        /drivers/usb/host/
        /drivers/usb/storage/
        sd_mod
        dm-mod
        dm-verity
        erofs
        efivarfs
        # Crypto the initrd needs but no module declares: libcrc32c (for erofs) asks
        # the crypto API for crc32c at load, a softdep mkosi doesn't follow, and
        # dm-verity picks its sha256 when the initrd opens the root, for good.
        crc32c_generic
        crc32c-intel
        sha256-ssse3
