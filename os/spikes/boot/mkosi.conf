# OS-0 signed-boot spike: the smallest Debian 13 image that boots through
# shim (Microsoft-signed) → systemd-boot (Debian-signed) → kernel (Debian-signed),
# with an erofs root under dm-verity. Not the product config (that is os/mkosi/, OS-1).

[Distribution]
Distribution=debian
Release=trixie
Repositories=main

[Output]
Format=disk
ImageId=bismillah-spike-boot

[Content]
Bootable=yes
Bootloader=systemd-boot-signed
ShimBootloader=signed
UnifiedKernelImages=none
Packages=
        linux-image-amd64
        shim-signed
        shim-helpers-amd64-signed
        systemd-boot-efi-amd64-signed
        systemd
        systemd-sysv
        udev
        dbus
        cryptsetup-bin
KernelCommandLine=console=ttyS0 systemd.log_target=console
Autologin=yes
RootPassword=hashed:

[Build]
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie

[Runtime]
Firmware=uefi-secure-boot
FirmwareVariables=microsoft
RAM=2G
