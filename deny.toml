# cargo-deny configuration — run with `cargo deny check`.
# Enforces part of bismillah's offline boundary (ADR-0003) and licence hygiene.
# Bans are a guard rail, not proof: see ARCHITECTURE.md §10 for the runtime tests.

[graph]
# Check the feature set the app is actually built with. Tauri has optional networking
# features (reqwest, hyper) that `all-features` would switch on hypothetically; enabling
# any of them for real still fails the bans below.
all-features = false
# Desktop only (ADR-0009). Tauri pulls reqwest in for Android and iOS, which bismillah
# never targets.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error is unmaintained. It is a compile-time dependency of glib-macros in
  # gtk-rs 0.18, the GTK3 bindings Tauri 2 uses on Linux, and never ships in the binary.
  { id = "RUSTSEC-2024-0370", reason = "compile-time only, via Tauri's GTK3 bindings" },
  # harper-core 2.13 (the newest) depends on zip 8. These three advisories concern
  # ZipArchive::extract / ZipStreamReader::extract writing an attacker's archive to disk.
  # Harper only reads its rule packs from bytes in memory (Weirpack::from_bytes) and
  # bismillah loads none. Drop these once harper-core moves to zip >= 9.
  { id = "RUSTSEC-2026-0367", reason = "extract() is never called: harper-core reads zips in memory only" },
  { id = "RUSTSEC-2026-0368", reason = "extract() is never called: harper-core reads zips in memory only" },
  { id = "RUSTSEC-2026-0369", reason = "extract() is never called: harper-core reads zips in memory only" },
  # Unmaintained, no vulnerability. bincode decodes the weights of Harper's embedded
  # chunker model, which are compiled into the binary (burn-core); paste is a macro used
  # at compile time.
  { id = "RUSTSEC-2025-0141", reason = "bincode only decodes model weights compiled into the binary" },
  { id = "RUSTSEC-2024-0436", reason = "paste is a compile-time macro" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# All compatible with distributing bismillah under GPL-3.0-or-later.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0-or-later",
  "GPL-3.0-or-later",
  # minicbor, through ur (Print to Phone): permissive; the author's decision, 2026-10-31.
  "BlueOak-1.0.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# No networking features, telemetry or update channels. Ever.
deny = [
  # HTTP clients and servers
  { crate = "reqwest", reason = "bismillah has no networking features (ADR-0003)" },
  { crate = "ureq", reason = "bismillah has no networking features (ADR-0003)" },
  { crate = "hyper", reason = "bismillah has no networking features (ADR-0003)" },
  { crate = "isahc", reason = "bismillah has no networking features (ADR-0003)" },
  { crate = "curl", reason = "bismillah has no networking features (ADR-0003)" },
  { crate = "surf", reason = "bismillah has no networking features (ADR-0003)" },
  { crate = "attohttpc", reason = "bismillah has no networking features (ADR-0003)" },
  { crate = "tungstenite", reason = "bismillah has no networking features (ADR-0003)" },
  { crate = "native-tls", reason = "TLS implies networking (ADR-0003)" },
  { crate = "rustls", reason = "TLS implies networking (ADR-0003)" },
  # Network-capable Tauri plugins
  { crate = "tauri-plugin-http", reason = "no networking (ADR-0003)" },
  { crate = "tauri-plugin-updater", reason = "no update checks (ADR-0003)" },
  { crate = "tauri-plugin-websocket", reason = "no networking (ADR-0003)" },
  { crate = "tauri-plugin-upload", reason = "no networking (ADR-0003)" },
  # Telemetry and crash reporting
  { crate = "sentry", reason = "no telemetry or crash reporting" },
  { crate = "opentelemetry", reason = "no telemetry" },
  { crate = "tauri-plugin-aptabase", reason = "no telemetry" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
