# web/ is its own pnpm root with its own lockfile, apart from the app's
# (../pnpm-workspace.yaml): the site and the app never share a dependency.
packages: []

# workerd must run its postinstall or `wrangler dev` (`pnpm preview`) cannot boot
# the local Workers runtime. sharp is Astro's build-time image service.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# pnpm holds back releases younger than a day. Exclude a fresh version only when
# we need it now, by exact version, and drop the entry once it has aged.
