# web/ is its own pnpm root with its own lockfile, apart from the app's
# (../pnpm-workspace.yaml): the site and the app never share a dependency.
packages: []

# workerd must run its postinstall or `wrangler dev` (`pnpm preview`) cannot boot
# the local Workers runtime. sharp is Astro's build-time image service.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# pnpm holds back releases younger than a day. Exclude a fresh version only when
# we need it now, by exact version, and drop the entry once it has aged.

# rolldown 1.3's wasm32 binding pins @emnapi/core and @emnapi/runtime to
# 2.0.0-beta.2. pnpm then resolves @astrojs/check's @emnapi/runtime peer to that
# beta while its @emnapi/core stays 1.x, and `astro check` crashes on exit
# ("this.bridge.deleteEnv is not a function"). Keep the pair on one stable
# release; drop this once rolldown's binding ships against a stable emnapi 2.
overrides:
  "@emnapi/core": 1.11.3
  "@emnapi/runtime": 1.11.3
