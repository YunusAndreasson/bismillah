# The app's checks on every push and pull request: `pnpm verify --fast`, split into
# a job for the front end and one for Rust, so "CI is green" and "it passed on my
# machine" mean the same thing. The real-app suites (build, e2e, visual) stay in the
# local `pnpm verify`: their baselines are drawn by the author's WebKitGTK and fonts.
# The website has its own workflow (web.yml).
name: Verify

on:
  push:
    branches: [main]
    paths-ignore: ["web/**"]
  pull_request:
    paths-ignore: ["web/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm before setup-node: `cache: pnpm` asks pnpm where its store is. The
      # version comes from package.json `packageManager`.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # svelte-check and tsc strict; ESLint and Prettier; Vitest.
      - run: pnpm check
      - run: pnpm lint
      # A few tests drive thousands of fake-timer frames (Print to Phone, the caret's
      # blink), which can pass Vitest's 5 s default on a shared runner.
      - run: pnpm test --testTimeout=20000

  rust:
    runs-on: ubuntu-24.04
    # A cold build compiles Tauri, WebKitGTK's bindings and Harper twice (check,
    # then test); the cache makes later runs much shorter.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri's WebKitGTK and GTK headers, and libdbus for the stick's helper.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libdbus-1-dev pkg-config

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      # Banned crates (anything that networks), licences, sources and advisories.
      - run: cargo deny check
