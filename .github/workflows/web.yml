# Verify the website (web/) on every push and pull request that touches it, with the
# same `pnpm verify` as locally, so "it passed on my machine" and "CI is green" mean
# the same thing. web/ is its own pnpm root with its own lockfile, so every step runs
# inside it.
#
# Deliberately not here:
# - Deploys. The site ships from the author's machine with `pnpm ship` (logged-in
#   wrangler), so no Cloudflare credential lives in GitHub (web/AGENTS.md).
# - The app. verify.yml runs its checks, and the whole gate is `pnpm verify` at the
#   root, run locally (AGENTS.md).
name: Web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm before setup-node: `cache: pnpm` asks pnpm where its store is. The
      # version comes from web/package.json `packageManager`.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Biome, astro check, astro build.
      - run: pnpm verify
