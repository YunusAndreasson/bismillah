name: Feature request
description: Something bismillah should do, or do differently.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        bismillah is small on purpose. Accounts, sync, telemetry, generative AI,
        networking and engagement mechanics are out for good (DESIGN.md §3), so
        requests for them are closed.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were writing, and where bismillah got in the way. A real situation helps more than a feature name.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working, keys included if you have an idea.
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: The workaround, if there is one.
