# Weekly, grouped so a week's updates arrive as a few pull requests. Each one runs
# the verify workflow (and the web workflow for web/); merge it when it's green and
# the definition of done in AGENTS.md holds. A new dependency still needs its row in
# ARCHITECTURE.md §2, and deny.toml still bans anything that networks.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The seal (ADR-0023) is written against hpke 0.13's single-shot API, which
      # 0.15 renamed; moving to it is a code change to review, not a version bump.
      - dependency-name: "hpke"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # sha2 0.11's hashers no longer implement io::Write, which the installer
      # streams files into (bismillah-install); moving is a code change too.
      - dependency-name: "sha2"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      tauri:
        patterns: ["tauri", "tauri-*", "wry", "tao"]
      rust:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # typescript-eslint and svelte-check don't support TypeScript 7 (the native
      # compiler) yet: typescript-eslint/typescript-eslint#10940. Lift this once they do.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # patches/@codemirror__view.patch is pinned to this exact version
      # (ARCHITECTURE.md §2); move both together, by hand.
      - dependency-name: "@codemirror/view"
    groups:
      codemirror:
        patterns: ["@codemirror/*", "@lezer/*"]
      app:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # astro check doesn't support TypeScript 7 (the native compiler) yet; it
      # asks for TypeScript 6. Lift this once it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
