[package]
name = "harper-latency"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
description = "Phase 0 spike: harper-core latency, block by block, on a ~50k-word document"

# Standalone: never part of the root bismillah workspace.
[workspace]

[dependencies]
harper-core = { version = "2.13.0", default-features = false, features = ["concurrent"] }

[features]
default = ["thesaurus"]
# The thesaurus only feeds BoringWords suggestions; measure the build without it.
thesaurus = ["harper-core/thesaurus"]

[profile.release]
debug = false
